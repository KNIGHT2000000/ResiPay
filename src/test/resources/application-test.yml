spring:
  application:
    name: resipay-test

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resipay}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Postgres@123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    admin:
      auto-create: false
      fail-fast: false

resipay:
  kafka:
    listener:
      auto-startup: true
    local-fallback:
      enabled: false

logging:
  level:
    root: WARN
    com.resipay: INFO
    org.flywaydb: INFO
