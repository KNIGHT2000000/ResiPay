spring:
  application:
    name: resipay-core

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resipay}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: ${KAFKA_ADMIN_AUTO_CREATE:false}
      fail-fast: false
    producer:
      properties:
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:3000}
    consumer:
      group-id: resipay-group
      auto-offset-reset: earliest
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}

resipay:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    admin:
      auto-create-topics: ${KAFKA_AUTO_CREATE_TOPICS:false}
    listener:
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}
    local-fallback:
      enabled: ${KAFKA_LOCAL_FALLBACK:true}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

gemini:
  api-key: ${GEMINI_API_KEY:yourapikey}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  timeout-ms: ${GEMINI_TIMEOUT_MS:30000}

agent:
  max-budget-inr: ${AGENT_MAX_BUDGET_INR:100000}
  proposal-ttl-minutes: ${AGENT_PROPOSAL_TTL_MINUTES:30}

logging:
  level:
    root: INFO
    com.resipay: DEBUG

